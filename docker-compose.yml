version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: lms_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: shobhitj1
      POSTGRES_DB: library_management
    ports:
      - "5432:5432"
    volumes:
      - lms_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d library_management"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lms_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: "postgresql://postgres:shobhitj1@postgres:5432/library_management?schema=public"
      JWT_ACCESS_SECRET: "dev_jwt_access_secret_super_secure_key_at_least_32_chars!"
      JWT_REFRESH_SECRET: "dev_jwt_refresh_secret_super_secure_key_at_least_32_chars!"
      JWT_ACCESS_EXPIRES_IN: "15m"
      JWT_REFRESH_EXPIRES_IN: "7d"
      SESSION_INACTIVITY_MINUTES: "15"
      CORS_ORIGIN: "*"
    ports:
      - "3000:3000"

volumes:
  lms_postgres_data:
